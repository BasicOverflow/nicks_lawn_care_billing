<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Clients — Nick's Lawn Care</title>
  <link rel="stylesheet" href="/static/css/app.css?v=29"/>
</head>
<body>
<header class="top">
  <span class="brand">Nick's Lawn Care</span>
  <nav class="nav">
    <a href="/howto">How to use</a>
    <a class="active" href="/data">Clients</a>
    <a href="/billing">Work</a>
  </nav>
  <div class="model-bar">
    <span id="modelStatus">Model: …</span>
    <button type="button" id="btnLoadModel">Load model</button>
  </div>
  <div id="progressBars" class="progress-bars"></div>
</header>

<main class="clients-page">
  <h1>Clients</h1>
  <p class="hint">Names, addresses, phones, emails, mowing prices, and hedge prices. A blank price clears that price. Save writes every row, including ones hidden by the search.</p>
  <section class="card" id="rosterCard">
    <label for="clientFilter">Find a client</label>
    <input id="clientFilter" type="search" placeholder="Name or address"/>
    <div id="clientWrap" class="table-scroll"></div>
    <div class="row-actions">
      <button type="button" id="btnAddClient">Add client</button>
      <button type="button" id="btnSaveClients">Save clients</button>
    </div>
    <p class="msg" id="clientMsg"></p>
  </section>
</main>
<script src="/static/js/app.js?v=14"></script>
<script>
let clientsLoaded = false;
function clientField(name, value, type) {
  const input = type === "notes" ? document.createElement("textarea") : document.createElement("input");
  input.className = type === "notes" ? "cell notes" : "cell";
  input.dataset.field = name;
  if (type === "notes") input.rows = 2;
  else input.type = type;
  if (type === "number") {
    input.step = "0.01";
    input.inputMode = "decimal";
  }
  input.value = value == null ? "" : String(value);
  return input;
}

function addClientRow(client) {
  const c = client || {};
  const tr = document.createElement("tr");
  if (c.id) tr.dataset.id = String(c.id);
  const fields = [
    ["name", c.name || "", "text"],
    ["address", c.address || "", "text"],
    ["mow_price", c.mow_price ?? "", "number"],
    ["hedge_price", c.hedge_price ?? "", "number"],
    ["phone", c.phone || "", "text"],
    ["email", c.email || "", "text"],
    ["notes", c.billing_notes || "", "notes"],
  ];
  fields.forEach(([name, value, type]) => {
    const td = document.createElement("td");
    if (name === "mow_price" || name === "hedge_price") td.className = "price";
    if (name === "notes") td.className = "notes";
    td.appendChild(clientField(name, value, type));
    tr.appendChild(td);
  });
  const mail = document.createElement("td");
  const box = document.createElement("input");
  box.type = "checkbox";
  box.dataset.field = "prefer_mail";
  box.checked = !!c.prefer_mail;
  mail.appendChild(box);
  tr.appendChild(mail);
  const tools = document.createElement("td");
  tools.className = "row-tools";
  const rm = document.createElement("button");
  rm.type = "button";
  rm.className = "linkish";
  rm.textContent = c.id ? "Delete" : "Remove";
  rm.onclick = async () => {
    if (!c.id) {
      tr.remove();
      return;
    }
    const label = (c.name || "this client").trim();
    if (!window.confirm(`Delete ${label}? Their work and bills are removed too.`)) return;
    try {
      await api("/api/clients/" + c.id, { method: "DELETE" });
      tr.remove();
      el("clientMsg").textContent = "Client deleted.";
      el("clientMsg").className = "msg ok";
    } catch (e) {
      el("clientMsg").textContent = e.message;
      el("clientMsg").className = "msg err";
    }
  };
  tools.appendChild(rm);
  tr.appendChild(tools);
  el("clientBody").appendChild(tr);
}

function renderClients(clients) {
  const wrap = el("clientWrap");
  wrap.innerHTML = "";
  const table = document.createElement("table");
  table.innerHTML = `<thead><tr>
    <th>Name</th><th>Address</th><th class="price">Mow</th><th class="price">Hedge</th>
    <th>Phone</th><th>Email</th><th class="notes">Notes</th><th>Mail</th><th>Delete</th>
  </tr></thead>`;
  const body = document.createElement("tbody");
  body.id = "clientBody";
  table.appendChild(body);
  wrap.appendChild(table);
  (clients || []).forEach(addClientRow);
  filterClients();
}

function filterClients() {
  const q = (el("clientFilter").value || "").trim().toLowerCase();
  document.querySelectorAll("#clientBody tr").forEach(tr => {
    const name = tr.querySelector('[data-field="name"]');
    const address = tr.querySelector('[data-field="address"]');
    const blob = `${name ? name.value : ""} ${address ? address.value : ""}`.toLowerCase();
    tr.hidden = !!(q && !blob.includes(q));
  });
}

function collectClients() {
  return [...document.querySelectorAll("#clientBody tr")].map(tr => {
    const val = field => {
      const node = tr.querySelector(`[data-field="${field}"]`);
      return node ? node.value : "";
    };
    const price = field => {
      const raw = val(field).trim();
      if (!raw) return null;
      const n = Number(raw);
      return Number.isFinite(n) ? n : null;
    };
    const mail = tr.querySelector('[data-field="prefer_mail"]');
    return {
      id: tr.dataset.id ? Number(tr.dataset.id) : null,
      name: val("name").trim(),
      address: val("address"),
      mow_price: price("mow_price"),
      hedge_price: price("hedge_price"),
      phone: val("phone"),
      email: val("email"),
      billing_notes: val("notes"),
      prefer_mail: !!(mail && mail.checked),
    };
  }).filter(row => row.name);
}

async function loadClients() {
  try {
    const r = await api("/api/clients");
    renderClients(r.clients || []);
    fillManualClients(r.clients || []);
    clientsLoaded = true;
  } catch (e) {
    clientsLoaded = false;
    el("clientMsg").textContent = e.message;
    el("clientMsg").className = "msg err";
  }
}

function fillManualClients(clients) {
  const sel = el("manualClient");
  if (!sel) return;
  const current = sel.value;
  sel.innerHTML = "";
  (clients || []).forEach(c => {
    const o = document.createElement("option");
    o.value = String(c.id);
    o.textContent = c.name;
    sel.appendChild(o);
  });
  if (current) sel.value = current;
}


el("clientFilter").addEventListener("input", filterClients);
el("btnAddClient").onclick = () => {
  addClientRow({});
  const rows = document.querySelectorAll("#clientBody tr");
  const last = rows[rows.length - 1];
  if (last) {
    last.hidden = false;
    const name = last.querySelector('[data-field="name"]');
    if (name) name.focus();
  }
};
el("btnSaveClients").onclick = async () => {
  el("btnSaveClients").disabled = true;
  el("clientMsg").textContent = "Saving…";
  el("clientMsg").className = "msg";
  try {
    const r = await api("/api/clients", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({clients: collectClients()}),
    });
    renderClients(r.clients || []);
    el("clientMsg").textContent = `Saved ${r.saved} client${r.saved === 1 ? "" : "s"}.`;
    el("clientMsg").className = "msg ok";
  } catch (e) {
    el("clientMsg").textContent = e.message;
    el("clientMsg").className = "msg err";
  } finally {
    el("btnSaveClients").disabled = false;
  }
};
loadClients();
</script>
</body>
</html>
